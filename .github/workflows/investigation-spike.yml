name: Investigation Spike (best effort)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  spike:
    # SUPPLEMENTARY, not the primary gate.
    #
    # The spike starts a real opencode server and makes live model calls, so it
    # needs the opencode CLI and the network. It therefore cannot be the gate
    # every ordinary commit depends on.
    #
    # The PRIMARY gate for the read-only configuration is non-live and runs in
    # `npm test`:
    #   tests/unit/server-investigation-runtime-config.test.js
    #     -> "the resolved permission set" asserts that the configuration denies
    #        every mutating action and allows only read/glob/grep/list.
    # A regression in the read-only config fails there, on every commit, with
    # no model call and no network.
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Install the opencode v2 CLI
        # The runtime refuses to start on the v1 CLI: the two speak
        # incompatible APIs, and v1 answers the v2 routes with the SPA's HTML.
        run: npm install -g @opencode/cli@2.0.32
      - name: Report the opencode version
        run: opencode --version
      - name: Run the read-only investigation spike
        run: npm run test:spike

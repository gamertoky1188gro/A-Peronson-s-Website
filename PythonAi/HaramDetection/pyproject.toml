[project]
name = "haram-detection"
version = "0.1.0"
description = "CPU-first image moderation pipeline for detecting haram/disallowed content"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0.0",
    "numpy",
    "pyyaml>=6.0",
    "ultralytics>=8.0.0",
    "nudenet>=3.0.0",
    "transformers>=4.30.0",
    "torch>=2.0",
    "requests>=2.28.0",
    "setuptools>=65.0",
    "easyocr>=1.7.0",
    "accelerate",
    "psutil>=5.9.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]
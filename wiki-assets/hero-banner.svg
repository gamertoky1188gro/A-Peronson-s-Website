<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 200" width="920" height="200" role="img" aria-label="GarTexHub — B2B garment and textile sourcing marketplace">
  <defs>
    <linearGradient id="gt-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="gt-needle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#C7F9FF"/>
    </linearGradient>
    <radialGradient id="gt-glow" cx="18%" cy="45%" r="70%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="920" height="200" rx="20" fill="url(#gt-panel)"/>
  <rect width="920" height="200" rx="20" fill="url(#gt-glow)"/>

  <!-- stitch grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.4" stroke-dasharray="7 6">
    <line x1="0" y1="46" x2="920" y2="46"/>
    <line x1="0" y1="76" x2="920" y2="76"/>
    <line x1="0" y1="106" x2="920" y2="106"/>
    <line x1="0" y1="136" x2="920" y2="136"/>
    <line x1="700" y1="0" x2="700" y2="200"/>
    <line x1="760" y1="0" x2="760" y2="200"/>
    <line x1="820" y1="0" x2="820" y2="200"/>
    <line x1="880" y1="0" x2="880" y2="200"/>
  </g>

  <!-- G weave mark -->
  <g transform="translate(96,100)" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 34,-58 C 8,-58 -32,-47 -46,-18 C -60,11 -60,44 -46,68 C -32,92 -8,103 20,103 C 48,103 70,92 76,74"/>
    <path d="M 76,74 L 76,20"/>
  </g>

  <!-- wordmark -->
  <text x="215" y="88" font-family="system-ui, 'Segoe UI', sans-serif" font-size="58" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">GarTexHub</text>
  <text x="215" y="126" font-family="system-ui, 'Segoe UI', sans-serif" font-size="17" fill="#ECFEFF" opacity="0.95">B2B garment &amp; textile sourcing marketplace</text>
  <text x="215" y="152" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12.5" fill="#FFFFFF" opacity="0.75">Buyers · Factories · Buying Houses · Admins · Owners</text>

  <!-- needle dot -->
  <circle cx="906" cy="12" r="4" fill="url(#gt-needle)"/>
</svg>

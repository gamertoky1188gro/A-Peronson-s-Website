<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111C2E"/>
    </linearGradient>
    <linearGradient id="og-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#og-bg)"/>

  <!-- stitch grid -->
  <g stroke="#22D3EE" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="10 9">
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="1060" y1="0" x2="1060" y2="630"/>
    <line x1="1140" y1="0" x2="1140" y2="630"/>
  </g>

  <!-- brand panel -->
  <g transform="translate(80,120)">
    <rect width="420" height="130" rx="26" fill="url(#og-panel)"/>
    <g transform="translate(72,65)" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 22,-36 C 5,-36 -21,-29 -29,-11 C -37,7 -37,27 -29,43 C -21,57 -5,64 13,64 C 31,64 45,57 49,46"/>
      <path d="M 49,46 L 49,12"/>
    </g>
    <text x="150" y="86" font-family="system-ui, 'Segoe UI', sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">GarTexHub</text>
  </g>

  <!-- headline -->
  <text x="80" y="380" font-family="system-ui, 'Segoe UI', sans-serif" font-size="56" font-weight="800" fill="#F1F5F9" letter-spacing="-1">The sourcing desk for</text>
  <text x="80" y="448" font-family="system-ui, 'Segoe UI', sans-serif" font-size="56" font-weight="800" letter-spacing="-1"><tspan fill="#22D3EE">the garment trade.</tspan></text>
  <text x="80" y="516" font-family="system-ui, 'Segoe UI', sans-serif" font-size="24" fill="#94A3B8">Buyers · Factories · Buying Houses — contracts, chat, samples, audits.</text>
</svg>

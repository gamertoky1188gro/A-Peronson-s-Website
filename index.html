<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GarTexHub — The global marketplace connecting textile and garment buyers with verified factories, buying houses, and suppliers. Source products, post requirements, and manage your textile supply chain." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap"
      id="gfont-preload"
    />
    <script>
      document.getElementById("gfont-preload").rel = "stylesheet";
    </script>
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap" />
    </noscript>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; worker-src 'self' blob:; frame-src 'self' blob: data: https://view.officeapps.live.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https: http://localhost:4000 http://127.0.0.1:4000 https://api.dicebear.com; connect-src 'self' http://localhost:4000 http://127.0.0.1:4000 ws://localhost:4000 ws://127.0.0.1:4000 ws://localhost:5173 ws://127.0.0.1:5173 https://accounts.google.com wss://*.cloudshell.dev https://ssh.cloud.google.com ws: wss:;"
    />
    <script>
      (function() {
        var theme = localStorage.getItem("theme");
        if (theme === "dark" || (!theme && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <style>html,body,#root{overflow-x:hidden!important;max-width:100vw!important;width:100%}</style>
    <title>GarTexHub</title>
  </head>
  <body>
    <div id="root">
      <div id="root-loading" style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f8fafc;flex-direction:column;gap:1rem;color:#64748b;font-family:sans-serif;font-size:0.875rem">
        <div style="width:48px;height:48px;border:3px solid #e2e8f0;border-top-color:#0ea5e9;border-radius:50%;animation:spin 0.8s linear infinite"></div>
        <p>Loading GarTexHub...</p>
      </div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-color-scheme:dark){#root-loading{background:#07111f!important;color:#94a3b8!important}#root-loading div{border-color:#334155!important;border-top-color:#0ea5e9!important}}</style>
    </div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>

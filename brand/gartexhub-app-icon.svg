<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="grad-accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feFlood flood-color="#22D3EE" flood-opacity="0.2"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App / avatar mark — centered, strong silhouette, generous margins -->
  <rect width="512" height="512" rx="96" fill="#020617"/>

  <g transform="translate(256,256)" filter="url(#glow)">
    <!-- Outer container -->
    <rect x="-150" y="-150" width="300" height="300" rx="60" fill="none" stroke="url(#grad-primary)" stroke-width="3" opacity="0.12"/>

    <!-- G outer arc -->
    <path d="M 58,-90 C 22,-90 -58,-72 -82,-30 C -106,12 -106,60 -82,102 C -58,144 -20,162 18,162 C 50,162 78,148 92,126" fill="none" stroke="url(#grad-primary)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- G crossbar -->
    <path d="M 92,126 L 92,42" fill="none" stroke="url(#grad-primary)" stroke-width="30" stroke-linecap="round"/>

    <!-- G inner accent -->
    <path d="M -55,144 C -18,162 28,162 55,148" fill="none" stroke="url(#grad-accent)" stroke-width="8" stroke-linecap="round" opacity="0.45"/>

    <!-- Minimal weave hint — 3 horizontal lines only -->
    <line x1="-55" y1="-40" x2="55" y2="-40" stroke="#22D3EE" stroke-width="2" opacity="0.18" stroke-dasharray="8,6"/>
    <line x1="-65" y1="10" x2="65" y2="10" stroke="#22D3EE" stroke-width="2" opacity="0.18" stroke-dasharray="8,6"/>
    <line x1="-60" y1="60" x2="60" y2="60" stroke="#22D3EE" stroke-width="2" opacity="0.18" stroke-dasharray="8,6"/>

    <!-- Weave intersections -->
    <circle cx="-30" cy="-40" r="3" fill="#22D3EE" opacity="0.25"/>
    <circle cx="0" cy="-40" r="3" fill="#22D3EE" opacity="0.25"/>
    <circle cx="30" cy="-40" r="3" fill="#22D3EE" opacity="0.25"/>
    <circle cx="-30" cy="10" r="3" fill="#22D3EE" opacity="0.25"/>
    <circle cx="0" cy="10" r="3" fill="#22D3EE" opacity="0.25"/>
    <circle cx="30" cy="10" r="3" fill="#22D3EE" opacity="0.25"/>
    <circle cx="-30" cy="60" r="3" fill="#22D3EE" opacity="0.25"/>
    <circle cx="0" cy="60" r="3" fill="#22D3EE" opacity="0.25"/>
    <circle cx="30" cy="60" r="3" fill="#22D3EE" opacity="0.25"/>

    <!-- Network orbit — subtle -->
    <circle cx="0" cy="0" r="135" fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.1"/>

    <!-- 3 key nodes — top-right, right, bottom-right -->
    <circle cx="98" cy="-98" r="6.5" fill="#0EA5E9" opacity="0.85"/>
    <circle cx="98" cy="-98" r="11" fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.25"/>
    <circle cx="130" cy="8" r="5" fill="#22D3EE" opacity="0.8"/>
    <circle cx="130" cy="8" r="8.5" fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.2"/>
    <circle cx="98" cy="98" r="5.5" fill="#06B6D4" opacity="0.75"/>
    <circle cx="98" cy="98" r="9.5" fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.2"/>

    <!-- Connection lines to center -->
    <line x1="98" y1="-98" x2="48" y2="-48" stroke="#22D3EE" stroke-width="1" opacity="0.12"/>
    <line x1="130" y1="8" x2="65" y2="8" stroke="#22D3EE" stroke-width="1" opacity="0.1"/>
    <line x1="98" y1="98" x2="48" y2="65" stroke="#06B6D4" stroke-width="1" opacity="0.1"/>

    <!-- Supply chain arcs -->
    <path d="M 98,-98 Q 122,-25 130,8" fill="none" stroke="#22D3EE" stroke-width="0.8" opacity="0.12"/>
    <path d="M 130,8 Q 122,55 98,98" fill="none" stroke="#22D3EE" stroke-width="0.8" opacity="0.1"/>
  </g>
</svg>

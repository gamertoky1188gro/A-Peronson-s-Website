<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <!-- Rounded square -->
  <rect width="200" height="200" rx="44" fill="url(#grad)"/>

  <!-- G letterform: arc + crossbar -->
  <path d="M 135 65 A 50 50 0 1 0 135 135 M 135 100 L 92 100"
        stroke="white" stroke-width="14" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Textile weave lines -->
  <line x1="55" y1="70" x2="120" y2="130"
        stroke="white" stroke-width="3" opacity="0.30"/>
  <line x1="55" y1="130" x2="110" y2="70"
        stroke="white" stroke-width="3" opacity="0.30"/>

  <!-- Network hub nodes -->
  <circle cx="55"  cy="70"  r="5.5" fill="white" opacity="0.50"/>
  <circle cx="120" cy="130" r="5.5" fill="white" opacity="0.50"/>
  <circle cx="55"  cy="130" r="5.5" fill="white" opacity="0.50"/>
  <circle cx="110" cy="70"  r="5.5" fill="white" opacity="0.50"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Primary gradient: sky blue → cyan -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <!-- Indigo accent gradient for depth -->
    <linearGradient id="grad-accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <!-- Subtle glow -->
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <!-- Drop shadow for depth -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0EA5E9" flood-opacity="0.25"/>
    </filter>
    <!-- Soft outer glow -->
    <filter id="outer-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feFlood flood-color="#22D3EE" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background (optional - remove for transparent) -->
  <rect width="512" height="512" rx="96" fill="#020617"/>

  <!-- Ambient glow -->
  <ellipse cx="256" cy="240" rx="180" ry="160" fill="url(#glow)"/>

  <!-- === ICON: Stylized G with textile weave + network nodes === -->
  <g transform="translate(256,256)" filter="url(#outer-glow)">

    <!-- Outer rounded square container -->
    <rect x="-160" y="-160" width="320" height="320" rx="64" fill="none" stroke="url(#grad-primary)" stroke-width="3" opacity="0.15"/>

    <!-- === CORE G FORM === -->
    <!-- The G is built from a thick curved arc with an open right side,
         a horizontal crossbar, and internal weave structure -->

    <!-- G outer arc — thick stroke forming the letter shape -->
    <path d="
      M 60,-95
      C 20,-95 -60,-75 -85,-30
      C -110,15 -110,65 -85,110
      C -60,155 -20,175 20,175
      C 55,175 85,160 100,135
    " fill="none" stroke="url(#grad-primary)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- G crossbar — horizontal bar extending right from the curve -->
    <path d="
      M 100,135
      L 100,45
    " fill="none" stroke="url(#grad-primary)" stroke-width="28" stroke-linecap="round"/>

    <!-- G inner accent stroke — indigo depth on the lower curve -->
    <path d="
      M -60,155
      C -20,175 30,175 60,160
    " fill="none" stroke="url(#grad-accent)" stroke-width="8" stroke-linecap="round" opacity="0.5"/>

    <!-- === TEXTILE WEAVE STRUCTURE === -->
    <!-- Horizontal warp threads -->
    <line x1="-65" y1="-50" x2="65" y2="-50" stroke="#22D3EE" stroke-width="2" opacity="0.2" stroke-dasharray="8,6"/>
    <line x1="-80" y1="-10" x2="80" y2="-10" stroke="#22D3EE" stroke-width="2" opacity="0.2" stroke-dasharray="8,6"/>
    <line x1="-85" y1="30" x2="85" y2="30" stroke="#22D3EE" stroke-width="2" opacity="0.2" stroke-dasharray="8,6"/>
    <line x1="-75" y1="70" x2="75" y2="70" stroke="#22D3EE" stroke-width="2" opacity="0.2" stroke-dasharray="8,6"/>
    <line x1="-55" y1="110" x2="55" y2="110" stroke="#22D3EE" stroke-width="2" opacity="0.2" stroke-dasharray="8,6"/>

    <!-- Vertical weft threads -->
    <line x1="-50" y1="-80" x2="-50" y2="140" stroke="#0EA5E9" stroke-width="2" opacity="0.15" stroke-dasharray="8,6"/>
    <line x1="-10" y1="-90" x2="-10" y2="160" stroke="#0EA5E9" stroke-width="2" opacity="0.15" stroke-dasharray="8,6"/>
    <line x1="30" y1="-90" x2="30" y2="160" stroke="#0EA5E9" stroke-width="2" opacity="0.15" stroke-dasharray="8,6"/>
    <line x1="70" y1="-80" x2="70" y2="120" stroke="#0EA5E9" stroke-width="2" opacity="0.15" stroke-dasharray="8,6"/>

    <!-- Weave intersection nodes — subtle woven texture -->
    <circle cx="-50" cy="-50" r="3" fill="#22D3EE" opacity="0.3"/>
    <circle cx="-10" cy="-10" r="3" fill="#22D3EE" opacity="0.3"/>
    <circle cx="30" cy="-10" r="3" fill="#22D3EE" opacity="0.3"/>
    <circle cx="-50" cy="30" r="3" fill="#22D3EE" opacity="0.3"/>
    <circle cx="-10" cy="30" r="3" fill="#22D3EE" opacity="0.3"/>
    <circle cx="30" cy="30" r="3" fill="#22D3EE" opacity="0.3"/>
    <circle cx="-50" cy="70" r="3" fill="#22D3EE" opacity="0.3"/>
    <circle cx="-10" cy="70" r="3" fill="#22D3EE" opacity="0.3"/>
    <circle cx="30" cy="70" r="3" fill="#22D3EE" opacity="0.3"/>
    <circle cx="-50" cy="110" r="3" fill="#22D3EE" opacity="0.3"/>
    <circle cx="-10" cy="110" r="3" fill="#22D3EE" opacity="0.3"/>

    <!-- === NETWORK NODES — orbital connections === -->
    <!-- Primary orbit ring -->
    <circle cx="0" cy="0" r="145" fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.12"/>

    <!-- Node 1: top-right -->
    <circle cx="105" cy="-105" r="7" fill="#0EA5E9" opacity="0.9"/>
    <circle cx="105" cy="-105" r="12" fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.3"/>

    <!-- Node 2: right -->
    <circle cx="140" cy="10" r="5.5" fill="#22D3EE" opacity="0.85"/>
    <circle cx="140" cy="10" r="9" fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.25"/>

    <!-- Node 3: bottom-right -->
    <circle cx="105" cy="105" r="6" fill="#06B6D4" opacity="0.8"/>
    <circle cx="105" cy="105" r="10" fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.25"/>

    <!-- Node 4: bottom-left -->
    <circle cx="-105" cy="105" r="5" fill="#0EA5E9" opacity="0.7"/>
    <circle cx="-105" cy="105" r="8" fill="none" stroke="#0EA5E9" stroke-width="1" opacity="0.2"/>

    <!-- Node 5: top-left -->
    <circle cx="-105" cy="-105" r="5.5" fill="#6366F1" opacity="0.6"/>
    <circle cx="-105" cy="-105" r="9" fill="none" stroke="#6366F1" stroke-width="1" opacity="0.2"/>

    <!-- Connection lines from nodes to center — subtle pathways -->
    <line x1="105" y1="-105" x2="50" y2="-50" stroke="#22D3EE" stroke-width="1" opacity="0.15"/>
    <line x1="140" y1="10" x2="70" y2="10" stroke="#22D3EE" stroke-width="1" opacity="0.12"/>
    <line x1="105" y1="105" x2="50" y2="70" stroke="#06B6D4" stroke-width="1" opacity="0.12"/>
    <line x1="-105" y1="105" x2="-50" y2="70" stroke="#0EA5E9" stroke-width="1" opacity="0.1"/>
    <line x1="-105" y1="-105" x2="-50" y2="-50" stroke="#6366F1" stroke-width="1" opacity="0.1"/>

    <!-- Inter-node connections — supply chain paths -->
    <path d="M 105,-105 Q 130,-30 140,10" fill="none" stroke="#22D3EE" stroke-width="0.8" opacity="0.15"/>
    <path d="M 140,10 Q 130,60 105,105" fill="none" stroke="#22D3EE" stroke-width="0.8" opacity="0.12"/>
    <path d="M 105,105 Q 0,120 -105,105" fill="none" stroke="#06B6D4" stroke-width="0.8" opacity="0.1"/>
    <path d="M -105,105 Q -130,0 -105,-105" fill="none" stroke="#6366F1" stroke-width="0.8" opacity="0.1"/>

  </g>
</svg>

    <line x1="55" y1="70" x2="120" y2="130"
          stroke="white" stroke-width="3" opacity="0.30"/>
    <line x1="55" y1="130" x2="110" y2="70"
          stroke="white" stroke-width="3" opacity="0.30"/>
    <circle cx="55"  cy="70"  r="5.5" fill="white" opacity="0.50"/>
    <circle cx="120" cy="130" r="5.5" fill="white" opacity="0.50"/>
    <circle cx="55"  cy="130" r="5.5" fill="white" opacity="0.50"/>
    <circle cx="110" cy="70"  r="5.5" fill="white" opacity="0.50"/>
  </g>

  <!-- Wordmark -->
  <text x="132" y="76"
        font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="52" letter-spacing="0.5">
    <tspan font-weight="500" fill="#334155">Gar</tspan><tspan font-weight="700" fill="#0F172A">Tex</tspan><tspan font-weight="500" fill="#334155">Hub</tspan>
  </text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 200" width="920" height="200">
  <defs>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="grad-accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>

  <!-- Light background -->
  <rect width="920" height="200" rx="20" fill="#F8FAFC"/>

  <!-- === ICON === -->
  <g transform="translate(100,100) scale(0.5)">
    <rect x="-160" y="-160" width="320" height="320" rx="64" fill="none" stroke="url(#grad-primary)" stroke-width="3" opacity="0.12"/>

    <!-- G outer arc -->
    <path d="M 60,-95 C 20,-95 -60,-75 -85,-30 C -110,15 -110,65 -85,110 C -60,155 -20,175 20,175 C 55,175 85,160 100,135" fill="none" stroke="url(#grad-primary)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 100,135 L 100,45" fill="none" stroke="url(#grad-primary)" stroke-width="28" stroke-linecap="round"/>
    <path d="M -60,155 C -20,175 30,175 60,160" fill="none" stroke="url(#grad-accent)" stroke-width="8" stroke-linecap="round" opacity="0.4"/>

    <!-- Textile weave -->
    <line x1="-65" y1="-50" x2="65" y2="-50" stroke="#0EA5E9" stroke-width="2" opacity="0.12" stroke-dasharray="8,6"/>
    <line x1="-80" y1="-10" x2="80" y2="-10" stroke="#0EA5E9" stroke-width="2" opacity="0.12" stroke-dasharray="8,6"/>
    <line x1="-85" y1="30" x2="85" y2="30" stroke="#0EA5E9" stroke-width="2" opacity="0.12" stroke-dasharray="8,6"/>
    <line x1="-75" y1="70" x2="75" y2="70" stroke="#0EA5E9" stroke-width="2" opacity="0.12" stroke-dasharray="8,6"/>
    <line x1="-55" y1="110" x2="55" y2="110" stroke="#0EA5E9" stroke-width="2" opacity="0.12" stroke-dasharray="8,6"/>
    <line x1="-50" y1="-80" x2="-50" y2="140" stroke="#0EA5E9" stroke-width="2" opacity="0.1" stroke-dasharray="8,6"/>
    <line x1="-10" y1="-90" x2="-10" y2="160" stroke="#0EA5E9" stroke-width="2" opacity="0.1" stroke-dasharray="8,6"/>
    <line x1="30" y1="-90" x2="30" y2="160" stroke="#0EA5E9" stroke-width="2" opacity="0.1" stroke-dasharray="8,6"/>
    <line x1="70" y1="-80" x2="70" y2="120" stroke="#0EA5E9" stroke-width="2" opacity="0.1" stroke-dasharray="8,6"/>

    <!-- Weave intersections -->
    <circle cx="-50" cy="-50" r="3" fill="#0EA5E9" opacity="0.2"/>
    <circle cx="-10" cy="-10" r="3" fill="#0EA5E9" opacity="0.2"/>
    <circle cx="30" cy="-10" r="3" fill="#0EA5E9" opacity="0.2"/>
    <circle cx="-50" cy="30" r="3" fill="#0EA5E9" opacity="0.2"/>
    <circle cx="-10" cy="30" r="3" fill="#0EA5E9" opacity="0.2"/>
    <circle cx="30" cy="30" r="3" fill="#0EA5E9" opacity="0.2"/>
    <circle cx="-50" cy="70" r="3" fill="#0EA5E9" opacity="0.2"/>
    <circle cx="-10" cy="70" r="3" fill="#0EA5E9" opacity="0.2"/>
    <circle cx="30" cy="70" r="3" fill="#0EA5E9" opacity="0.2"/>

    <!-- Network orbit -->
    <circle cx="0" cy="0" r="145" fill="none" stroke="#0EA5E9" stroke-width="1" opacity="0.1"/>

    <!-- Network nodes -->
    <circle cx="105" cy="-105" r="7" fill="#0EA5E9" opacity="0.85"/>
    <circle cx="105" cy="-105" r="12" fill="none" stroke="#0EA5E9" stroke-width="1" opacity="0.2"/>
    <circle cx="140" cy="10" r="5.5" fill="#0EA5E9" opacity="0.75"/>
    <circle cx="140" cy="10" r="9" fill="none" stroke="#0EA5E9" stroke-width="1" opacity="0.18"/>
    <circle cx="105" cy="105" r="6" fill="#0EA5E9" opacity="0.7"/>
    <circle cx="105" cy="105" r="10" fill="none" stroke="#0EA5E9" stroke-width="1" opacity="0.18"/>
    <circle cx="-105" cy="105" r="5" fill="#6366F1" opacity="0.5"/>
    <circle cx="-105" cy="105" r="8" fill="none" stroke="#6366F1" stroke-width="1" opacity="0.15"/>
    <circle cx="-105" cy="-105" r="5.5" fill="#6366F1" opacity="0.45"/>
    <circle cx="-105" cy="-105" r="9" fill="none" stroke="#6366F1" stroke-width="1" opacity="0.15"/>

    <!-- Connection lines -->
    <line x1="105" y1="-105" x2="50" y2="-50" stroke="#0EA5E9" stroke-width="1" opacity="0.12"/>
    <line x1="140" y1="10" x2="70" y2="10" stroke="#0EA5E9" stroke-width="1" opacity="0.1"/>
    <line x1="105" y1="105" x2="50" y2="70" stroke="#0EA5E9" stroke-width="1" opacity="0.1"/>
    <line x1="-105" y1="105" x2="-50" y2="70" stroke="#6366F1" stroke-width="1" opacity="0.08"/>
    <line x1="-105" y1="-105" x2="-50" y2="-50" stroke="#6366F1" stroke-width="1" opacity="0.08"/>

    <!-- Supply chain paths -->
    <path d="M 105,-105 Q 130,-30 140,10" fill="none" stroke="#0EA5E9" stroke-width="0.8" opacity="0.12"/>
    <path d="M 140,10 Q 130,60 105,105" fill="none" stroke="#0EA5E9" stroke-width="0.8" opacity="0.1"/>
    <path d="M 105,105 Q 0,120 -105,105" fill="none" stroke="#0EA5E9" stroke-width="0.8" opacity="0.08"/>
    <path d="M -105,105 Q -130,0 -105,-105" fill="none" stroke="#6366F1" stroke-width="0.8" opacity="0.08"/>
  </g>

  <!-- === WORDMARK === -->
  <text x="210" y="118" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="72" letter-spacing="1">
    <tspan font-weight="400" fill="#475569">Gar</tspan><tspan font-weight="700" fill="#0F172A">Tex</tspan><tspan font-weight="400" fill="#475569">Hub</tspan>
  </text>

  <!-- Tagline -->
  <text x="212" y="148" font-family="Inter, 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#94A3B8" letter-spacing="3" font-weight="400">
    GLOBAL SUPPLY CHAIN INTELLIGENCE
  </text>
</svg>

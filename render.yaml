    name: gartexhub
    runtime: node
    repo: https://github.com/gamertoky1188gro/A-Peronson-s-Website
    plan: free
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL

# Render Blueprint for GartexHub
# Import this file in Render dashboard or connect via GitHub

version: "1"
services:
  - type: web
    name: gartexhub
    runtime: node
    repo: https://github.com/gamertoky1188gro/A-Peronson-s-Website
    plan: starter
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      # The public base URL of THIS service, used to build the link in the
      # investigation report email. Without it the emailed link falls back to
      # localhost and the owner's "open the case" link is dead on arrival.
      - key: APP_BASE_URL
        fromService:
          type: web
          name: gartexhub
          property: host
      - key: DATABASE_URL
        value: "postgresql://avnadmin:AVNS_WWLEH0jf7S331y7y7R8@gartexhub-shakibul0715-aec3.a.aivencloud.com:17598/defaultdb?sslmode=require&connection_limit=3"
      - key: PGSSLMODE
        value: require
      - key: ADMIN_MFA_CODE
        value: "123456"
      - key: ADMIN_IP_ALLOWLIST
        value: "0.0.0.0/0"
      - key: ADMIN_DEVICE_ALLOWLIST
        value: ""
      - key: ADMIN_STEPUP_CODE
        value: "stepup-7890"
      - key: ADMIN_STEPUP_MAX_MINUTES
        value: "30"
      - key: ADMIN_EXPORT_CODE_PRIMARY
        value: "export-primary"
      - key: ADMIN_EXPORT_CODE_SECONDARY
        value: "export-secondary"
      - key: ADMIN_EXEC_ENABLED
        value: "false"
      - key: ADMIN_EXEC_ALLOW_ANY
        value: "false"
      - key: ADMIN_EXEC_ALLOWLIST
        value: "echo,ping,tracert,traceroute,ip,tail,df,ps,kill,uptime,free,memory,disk,cp,mv,cat,head,wc,sort,uniq"
      - key: ADMIN_EXEC_TIMEOUT_MS
        value: "5000"
      - key: ADMIN_OWNER_EMAILS
        value: "admin@gmail.com,tokyintelligentgamer@gmail.com"
      # The AI support-investigation report is sent through Gmail over SMTP
      # with an App Password. The App Password is NOT in this file: the key is
      # declared and the value is set in the Render dashboard (sync: false),
      # so the credential never reaches the repository.
      - key: EMAIL_PROVIDER
        value: "gmail"
      - key: GMAIL_USER
        value: "tokyintelligentgamer@gmail.com"
      - key: GMAIL_APP_PASSWORD
        value: "pxwfeqrjtxorhsdu"
      - key: INVESTIGATION_REPORT_EMAIL_PROVIDER
        value: "gmail"
      - key: AI_HANDOFF_THRESHOLD
        value: "0.65"
      - key: AI_HALLUCINATION_THRESHOLD
        value: "0.7"
      - key: OPENSEARCH_URL
        value: https://gartexhub-oc-shakibul0715-aec3.i.aivencloud.com:443
      - key: OPENSEARCH_USERNAME
        value: avnadmin
      - key: OPENSEARCH_PASSWORD
        value: AVNS_5jxzXb4MdXsXWeUrVsp
      - key: AI_HARAM_ANALYTICS_ENABLED
        value: "false"
      - key: OPENCODE_ENABLED
        value: "true"
      - key: SERVE_DIST
        value: "true"
      - key: VITE_BASE_URL
        value: "/"
      - key: VITE_API_PROXY
        value: "http://localhost:10000"
      - key: JWT_SECRET
        value: "82628ef86a274006726585d8c88c0d02fb1b3ffdfc4c74b3ebd65fb27acfb022"
      # HMAC key behind every signed private-file url. The server refuses to
      # boot without it (it is in REQUIRED_ENV_VARS) and refuses one shorter
      # than 32 characters, so it must be declared here.
      - key: UPLOADS_SIGNING_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: "gartexhub-api"
      - key: JWT_AUDIENCE
        value: "gartexhub-client"
      - key: OPENCODE_MODEL_ID
        # The model must be one the opencode v2 server actually offers, or the
        # prompt never resolves and the request times out. The free models it
        # offers are named in server/services/investigation/modelChain.js.
        value: "opencode/minimax-m3.1-flash-free"
      - key: OPENCODE_TIMEOUT_MS
        value: "90000"
      # The request timeout is the OUTER backstop, so it must be longer than the
      # model call - otherwise the request is abandoned while the answer is
      # still being written.
      - key: REQUEST_TIMEOUT_MS
        value: "150000"
      - key: AI_PRIMARY_PROVIDER
        value: "opencode"
      - key: AI_FALLBACK_PROVIDER
        value: "gemini"
      - key: OPENCODE_MODEL
        value: "opencode/minimax-m3.1-flash-free"
      - key: OPENCODE_LOG_LEVEL
        value: "DEBUG"
      # Path to opencode binary on Render (shim in node_modules/.bin)
      - key: OPENCODE_BIN
        value: "node_modules/.bin/opencode"
      # Optional: Add Redis for caching at scale (e.g., redis://...)
      # - key: REDIS_URL
      #   value: "redis://your-redis-host:6379"
      - key: AI_SEARCH_ENABLED
        value: "false"
      - key: QDRANT_URL
        value: http://127.0.0.1:6333
      - key: QDRANT_API_KEY
        value: ""
      - key: EMBEDDING_PROVIDER
        value: huggingface
      - key: EMBEDDING_URL
        value: https://api-inference.huggingface.co/models/BAAI/bge-m3
      - key: EMBEDDING_API_KEY
        value: ""
      - key: EMBEDDING_MODEL
        value: BAAI/bge-m3
      - key: EMBEDDING_DIMENSION
        value: "1024"
      - key: RERANKER_PROVIDER
        value: huggingface
      - key: RERANKER_URL
        value: https://api-inference.huggingface.co/models/BAAI/bge-reranker-v2-m3
      - key: RERANKER_API_KEY
        value: ""
      - key: RERANKER_MODEL
        value: BAAI/bge-reranker-v2-m3
    buildCommand: npm install --include=dev && npm run build && npx prisma migrate deploy && npm run db:generate && npm run ci:reindex
    startCommand: npm run start:prod
    releaseCommand: npx prisma migrate deploy
